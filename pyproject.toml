[project]
name = "east2west"
version = "0.1.0"
description = "East2West: checks that a rebuilt (to-be) web app behaves exactly like the running as-is app, bugs included. Playwright equivalence tests with an automatically approved as-is oracle, a Jev YAML runner and a crawler"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "East" }]
dependencies = [
  "playwright>=1.50",
  "typesafe-sdk>=0.6.0",
  "pyyaml>=6.0",
  "pytest-xdist>=3.8.0",
]

[project.scripts]
east2west = "east2west.cli:main"

[project.entry-points.pytest11]
east2west = "east2west.pwtest.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["east2west"]

[tool.pytest.ini_options]
testpaths = ["e2e", "tests"]
addopts = "-p no:cacheprovider"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
