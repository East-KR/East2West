[project]
name = "eastshift"
version = "0.1.0"
description = "EastShift: checks that a rebuilt (to-be) web app behaves exactly like the running as-is app, bugs included. Playwright equivalence tests with a human-approved oracle, a Jev YAML runner and a crawler"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.50",
  "typesafe-sdk>=0.6.0",
  "pyyaml>=6.0",
  "pytest-xdist>=3.8.0",
]

[project.scripts]
eastshift = "eastshift.cli:main"

[project.entry-points.pytest11]
eastshift = "eastshift.pwtest.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eastshift"]

[tool.pytest.ini_options]
testpaths = ["e2e", "tests"]
addopts = "-p no:cacheprovider"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
