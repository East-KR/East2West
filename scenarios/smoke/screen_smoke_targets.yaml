# Jev 없이 도는 스모크: 조회 버튼은 screens.targets.yaml에 적힌 이름 그대로, 상세는 첫 데이터 행의 링크.
# 대상은 `east2west targets`가 규칙으로 정하고, 애매한 화면만 사람이나 Claude Code가 고른다.
name: "스모크 - ${SCREEN}: 열기, 기본 조회, 첫 항목 상세"
matrix_file: screens.targets.yaml
steps:
  - goto: ${URL}
  - expect: { http_ok: true, no_js_error: true }
  - do: 목록 조회 실행
    target: { role: button, name: "${QUERY}" }
  - expect: { no_dialog: true, no_js_error: true, rows_at_least: 1 }
  - do: 결과 첫 행의 항목 열기
    target: { role: link, row: 1 }
  - expect: { http_ok: true, title_contains: "상세" }
