name: "유효성 - 이름과 체크인 없이 확정하면 오류 메시지, 예약 생성 안 됨"
steps:
  - goto: http://127.0.0.1:8787/
  - do: 숙박 일수를 2박으로 선택
  - do: 예약하기 버튼 누르기
  - expect: { snapshot_contains: 'dialog "예약 내용을 확정하시겠습니까?"' }
  - do: 확인 모달에서 확정 버튼 누르기
  - expect: { snapshot_contains: "alert: 예약자 이름과 체크인 날짜는 필수입니다." }
  - expect: { title_contains: "객실 예약" }
