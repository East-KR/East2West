name: "경계값 - 3박, 조식 포함이면 총 금액 360,000원"
steps:
  - goto: http://127.0.0.1:8787/
  - do: 투숙객 이름 입력
    fill: 박최대
  - do: 캘린더에서 2026년 11월 30일 선택
  - expect: { field: "선택한 체크인", value: "2026-11-30" }
  - do: 숙박 일수를 3박으로 선택
  - do: 조식 포함 체크
  - do: 예약하기 버튼 누르기
  - do: 확인 모달에서 확정 버튼 누르기
  - expect: { url_contains: "nights=3" }
  - expect: { url_contains: "breakfast=1" }
  - expect: { text: "총 금액 360,000원" }
  - expect: { text: "2026-11-30" }
