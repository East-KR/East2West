name: "내비게이션 - 예약 완료 페이지의 '다른 예약 하기' 링크는 빈 예약 폼으로 간다"
steps:
  - goto: http://127.0.0.1:8787/
  - do: 투숙객 이름 입력
    fill: 최이동
  - do: 캘린더에서 2026년 10월 20일 선택
  - do: 예약하기 버튼 누르기
  - do: 확인 모달에서 확정 버튼 누르기
  - expect: { url_contains: "/reservations/" }
  - do: 다른 예약 하기 링크 누르기
  - expect: { title_contains: "객실 예약" }
  - expect: { field: "투숙객 이름", value: "" }
