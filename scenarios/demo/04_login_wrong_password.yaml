name: "인증 - 잘못된 비밀번호는 오류 메시지를 보이고 로그인 페이지에 머문다"
steps:
  - goto: http://127.0.0.1:8787/login
  - do: 아이디 입력
    fill: tester
  - do: 비밀번호 입력
    fill: wrong-password
  - do: 로그인 버튼 누르기
  - expect: { url_contains: "/login" }
  - expect: { snapshot_contains: "alert: 아이디 또는 비밀번호가 올바르지 않습니다." }
  - expect: { field: "아이디", value: "" }   # 현재 코드는 실패 시 아이디를 보존하지 않는다 (개선 후보)
